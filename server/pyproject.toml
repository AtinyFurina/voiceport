[project]
name = "passport-input-server"
version = "0.1.0"
description = "AI Passport voice input frontend server"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "bleak>=0.22.0",
    "zeroconf>=0.132.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
