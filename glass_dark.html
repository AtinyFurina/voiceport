<!DOCTYPE html>
<html>
<head><style>body{margin:0;width:1024px;height:1024px;background:transparent}</style></head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#1a1f2b"/>
      <stop offset="55%" stop-color="#0d1017"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="blur8" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur24" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur48" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="48"/></filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 折射色散光斑（玻璃后方） -->
  <ellipse cx="330" cy="300" rx="200" ry="130" fill="#6c8cff" opacity="0.20" filter="url(#blur48)"/>
  <ellipse cx="720" cy="720" rx="220" ry="150" fill="#3fb950" opacity="0.14" filter="url(#blur48)"/>
  <ellipse cx="680" cy="300" rx="160" ry="110" fill="#c084fc" opacity="0.16" filter="url(#blur48)"/>

  <!-- 玻璃 squircle 主体 -->
  <rect x="200" y="200" width="624" height="624" rx="180" fill="url(#glass)" stroke="url(#edge)" stroke-width="4"/>

  <!-- 顶部高光弧 -->
  <path d="M 240 330 Q 512 210 784 330" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="24" stroke-linecap="round" filter="url(#blur24)"/>

  <!-- 底部反光 -->
  <ellipse cx="512" cy="760" rx="220" ry="40" fill="#ffffff" opacity="0.10" filter="url(#blur24)"/>

  <!-- 麦克风符号（白色描边） -->
  <g fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 512 690 v 56"/>
    <path d="M 620 560 v 34 a 108 108 0 0 1 -216 0 v -34"/>
    <rect x="470" y="452" width="84" height="182" rx="42"/>
  </g>
</svg>
</body>
</html>
